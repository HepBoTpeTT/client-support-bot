<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="utf-8">
        <title>Тест виджета</title>
        <style>
            body{
                margin: 0;
                padding: 0.5rem;
            }
            section{
                box-sizing: border-box;
                border: solid darkgray 1px;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 2rem;
                background-color: gray;
                height: calc(100vh - 1rem);
                width: 100%;
            }
        </style>
    </head>
    <body>
        <section>
            <h1 style="color: #f8f8f8">Здесь должен быть сайт</h1>
        </section>
        <!-- Site Assistant Widget : iframe -->
        <iframe
            src="http://localhost/chat-widget-html?baseUrl=http%3A%2F%2Flocalhost"
            style="border:none; background:transparent; max-width:450px; max-height:660px; height:100vh; width:100vw; position:fixed; bottom:0; right:0;"
            title="Помощник"
            onload="const f=this; const s=()=>{f.contentWindow.postMessage({type:'RESIZE',w:window.innerWidth},'*')}; window.addEventListener('resize',s); const t=setInterval(()=>{if(f.contentWindow){s();clearInterval(t)}},200);">
        </iframe>
    </body>
</html>
