<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Widget</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
        width: 100%; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        background: transparent;
        }

        /* Корневой контейнер виджета */
        #sa-root {
        position: relative;
        width: 100%;
        height: 100%;
        }

        /* Кнопка открытия/закрытия внутри iframe */
        #sa-widget-btn {
        position: absolute;
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--accent, #01696f);
        border: none;
        cursor: pointer;
        z-index: 2;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
        color: #fff;
        }
        #sa-widget-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(0,0,0,0.28);
        }
        #sa-widget-btn svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        }

        /* Панель чата */
        #sa-panel {
        position: absolute;
        bottom: 92px;
        right: 24px;
        width: 380px;
        max-width: calc(100% - 48px);
        height: 540px;
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 8px 40px rgba(0,0,0,0.18);
        display: flex;
        flex-direction: column;
        opacity: 0;
        transform: translateY(16px) scale(0.97);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
        }
        #sa-panel.open {
        opacity: 1;
        transform: none;
        pointer-events: all;
        }

        /* Шапка */
        #sa-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        flex-shrink: 0;
        background: var(--accent, #01696f);
        color: #fff;
        }
        .sa-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255,255,255,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: #fff;
        }
        .sa-header-info { flex: 1; min-width: 0; }
        .sa-name   { font-weight: 600; font-size: 14px; }
        .sa-status { font-size: 11px; opacity: 0.85; }

        /* Полоса оператора */
        #sa-op-bar {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        background: #eef7ff;
        border-top: 1px solid #c8e0f8;
        font-size: 12px;
        color: #3a7bc8;
        flex-shrink: 0;
        }
        #sa-op-bar.visible { display: flex; }
        .sa-op-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3a7bc8;
        flex-shrink: 0;
        animation: sa-pulse 1.5s infinite;
        }
        @keyframes sa-pulse {
        0%,100% { opacity: 1; }
        50%     { opacity: 0.35; }
        }

        /* Тело чата */
        #sa-body {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        }
        #sa-messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        background: var(--chat-bg, #f8f9fb);
        color: var(--text-color, #222);
        }
        #sa-messages::-webkit-scrollbar { width: 4px; }
        #sa-messages::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.12);
        border-radius: 4px;
        }

        .sa-msg {
        max-width: 82%;
        padding: 9px 13px;
        border-radius: 12px;
        font-size: 13.5px;
        line-height: 1.5;
        word-break: break-word;
        animation: sa-msg-in 0.18s ease;
        }
        @keyframes sa-msg-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
        }
        .sa-msg.user {
        align-self: flex-end;
        background: var(--accent, #01696f);
        color: #fff;
        border-bottom-right-radius: 4px;
        }
        .sa-msg.bot {
        align-self: flex-start;
        background: #fff;
        color: var(--text-color, #222);
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .sa-msg.operator {
        align-self: flex-start;
        background: #eef7ff;
        color: #1a4a7a;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        border-left: 3px solid #3a8fe8;
        }
        .sa-msg.system {
        align-self: center;
        background: #f0f0f0;
        color: #666;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 99px;
        font-style: italic;
        max-width: 90%;
        }
        .sa-msg.typing {
        color: #999;
        font-style: italic;
        }

        /* Оверлей оператора */
        #sa-op-overlay {
        display: none;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 10px 14px;
        z-index: 10;
        }
        #sa-op-overlay.visible { display: block; }
        #sa-op-btn {
        width: 100%;
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(4px);
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 12.5px;
        color: #555;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        transition: border-color 0.15s, color 0.15s, background 0.15s;
        white-space: nowrap;
        }
        #sa-op-btn:hover {
        border-color: var(--accent, #01696f);
        color: var(--accent, #01696f);
        background: rgba(255,255,255,0.98);
        }
        #sa-op-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        }
        #sa-op-btn svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        }

        /* Поле ввода */
        #sa-input-area {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid #eee;
        background: #fff;
        flex-shrink: 0;
        }
        #sa-input {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 13.5px;
        font-family: inherit;
        outline: none;
        resize: none;
        height: 38px;
        line-height: 1.4;
        transition: border-color 0.15s;
        }
        #sa-input:focus {
        border-color: var(--accent, #01696f);
        }
        #sa-send {
        background: var(--accent, #01696f);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 13px;
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 500;
        font-family: inherit;
        flex-shrink: 0;
        transition: filter 0.15s;
        }
        #sa-send:hover { filter: brightness(0.9); }
        #sa-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        }

        /* Экран загрузки */
        #sa-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-size: 13px;
        color: #999;
        }
    </style>
    </head>
    <body>
        <div id="sa-loading">Загрузка...</div>
        <div id="sa-root">
        <!-- Кнопка, которая всегда видна в правом нижнем углу iframe -->
        <button id="sa-widget-btn" aria-label="Открыть чат помощника">
            <svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
        </button>
        <!-- Панель чата -->
        <div id="sa-panel">
            <div id="sa-header">
            <div class="sa-avatar" id="sa-avatar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
                <path d="M2 14h2"/><path d="M20 14h2"/>
                <path d="M15 13v2"/><path d="M9 13v2"/>
                </svg>
            </div>
            <div class="sa-header-info">
                <div class="sa-name" id="sa-header-name">Помощник</div>
                <div class="sa-status" id="sa-header-status">Онлайн</div>
            </div>
            </div>

            <div id="sa-op-bar">
            <div class="sa-op-dot"></div>
            <span id="sa-op-bar-text">Ожидание оператора...</span>
            </div>

            <div id="sa-body">
            <div id="sa-messages"></div>
            <div id="sa-op-overlay" class="visible">
                <button id="sa-op-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
                    <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/>
                    <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
                </svg>
                Связаться с оператором
                </button>
            </div>
            </div>

            <div id="sa-input-area">
            <textarea id="sa-input" placeholder="Напишите вопрос..." rows="1"></textarea>
            <button id="sa-send">Отправить</button>
            </div>
        </div>
        </div>

        <script>
        (function () {
        var HEADPHONES_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';
        var BOT_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>';

        var params  = new URLSearchParams(window.location.search);
        var baseUrl = params.get('baseUrl') || '';

        var sessionId         = 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        var operatorMode      = false;
        var operatorActive    = false;
        var lastOperatorMsgId = 0;
        var pollTimer         = null;
        var botName           = 'Помощник';
        var initiated         = false;
        var isOpen            = false;

        var loading      = document.getElementById('sa-loading');
        var root         = document.getElementById('sa-root');
        var panel        = document.getElementById('sa-panel');
        var btn          = document.getElementById('sa-widget-btn');
        var messagesEl   = document.getElementById('sa-messages');
        var inputEl      = document.getElementById('sa-input');
        var sendBtn      = document.getElementById('sa-send');
        var opBtn        = document.getElementById('sa-op-btn');
        var opOverlay    = document.getElementById('sa-op-overlay');
        var opBar        = document.getElementById('sa-op-bar');
        var opBarText    = document.getElementById('sa-op-bar-text');
        var headerName   = document.getElementById('sa-header-name');
        var headerStatus = document.getElementById('sa-header-status');
        var avatar       = document.getElementById('sa-avatar');

        function applyTheme(accent, chatBg, textColor) {
            var d = document.documentElement;
            d.style.setProperty('--accent',     accent    || '#01696f');
            d.style.setProperty('--chat-bg',    chatBg    || '#f8f9fb');
            d.style.setProperty('--text-color', textColor || '#222222');
            document.getElementById('sa-header').style.background = accent || '#01696f';
        }

        function setBtnIcon(open) {
            if (open) {
            btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
            } else {
            btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
            }
        }

        function addMessage(role, text) {
            var el = document.createElement('div');
            el.className = 'sa-msg ' + role;
            el.textContent = text;
            messagesEl.appendChild(el);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return el;
        }

        async function sendAiMessage() {
            var text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = ''; inputEl.style.height = '38px';
            sendBtn.disabled = true;
            addMessage('user', text);
            var typing = addMessage('bot typing', '...');
            try {
            var r    = await fetch(baseUrl + '/api/chat', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ message: text, session_id: sessionId })
            });
            var data = await r.json();
            typing.remove();
            addMessage('bot', r.ok ? (data.reply || 'Извините, не могу ответить прямо сейчас.') : 'Извините, не могу ответить прямо сейчас. Попробуйте позже.');
            } catch (e) {
            typing.remove();
            addMessage('bot', 'Ошибка соединения с сервером.');
            }
            sendBtn.disabled = false;
            inputEl.focus();
        }

        async function sendOperatorMessage() {
            var text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = ''; inputEl.style.height = '38px';
            sendBtn.disabled = true;
            addMessage('user', text);
            try {
            await fetch(baseUrl + '/api/operator/user-message', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ session_id: sessionId, message: text })
            });
            } catch (e) {}
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function startOperatorPoll() {
            if (pollTimer) return;
            pollTimer = setInterval(async function () {
            try {
                var r    = await fetch(baseUrl + '/api/operator/poll/' + sessionId + '?last_id=' + lastOperatorMsgId);
                var data = await r.json();

                if (data.status === 'active' && !operatorActive) {
                operatorActive = true;
                opBarText.textContent = 'Оператор подключён';
                avatar.innerHTML = HEADPHONES_SVG;
                avatar.style.color = '#fff';
                headerName.textContent = 'Оператор';
                headerStatus.textContent = 'Онлайн';
                opOverlay.classList.remove('visible');
                }

                if (data.messages && data.messages.length) {
                data.messages.forEach(function (m) {
                    addMessage('operator', m.content);
                    lastOperatorMsgId = m.id;
                });
                }

                if (data.status === 'closed') {
                clearInterval(pollTimer); pollTimer = null;
                addMessage('system', 'Оператор завершил сеанс. Чат снова с AI-помощником.');
                operatorMode = false;
                operatorActive = false;
                opBar.classList.remove('visible');
                opOverlay.classList.add('visible');
                opBtn.disabled = false;
                opBtn.innerHTML = HEADPHONES_SVG + ' Связаться с оператором';
                avatar.innerHTML = BOT_SVG;
                avatar.style.color = '';
                headerName.textContent = botName;
                headerStatus.textContent = 'Онлайн';
                }
            } catch (e) {}
            }, 3000);
        }

        opBtn.addEventListener('click', async function () {
            if (operatorMode) return;
            operatorMode = true;
            opBtn.disabled = true;
            opBtn.innerHTML = '⏳ Запрос отправлен...';
            opBar.classList.add('visible');
            opBarText.textContent = 'Ожидание оператора...';
            addMessage('system', 'Запрос на подключение оператора отправлен. Ожидайте ответа.');
            try {
            await fetch(baseUrl + '/api/operator/request', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ message: 'Пользователь запрашивает оператора', session_id: sessionId })
            });
            } catch (e) {}
            startOperatorPoll();
        });

        sendBtn.addEventListener('click', function () {
            if (operatorMode) sendOperatorMessage(); else sendAiMessage();
        });
        inputEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (operatorMode) sendOperatorMessage(); else sendAiMessage();
            }
        });
        inputEl.addEventListener('input', function () {
            this.style.height = '38px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        btn.addEventListener('click', function () {
            isOpen = !isOpen;
            if (isOpen) {
            panel.classList.add('open');
            setBtnIcon(true);
            inputEl.focus();
            } else {
            panel.classList.remove('open');
            setBtnIcon(false);
            }
        });

        async function init() {
            if (initiated) return;
            initiated = true;
            try {
            var r   = await fetch(baseUrl + '/api/widget-config');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var cfg = await r.json();

            botName = cfg.bot_name || 'Помощник';
            applyTheme(cfg.accent_color, cfg.chat_bg_color, cfg.text_color);
            headerName.textContent = botName;

            loading.style.display = 'none';
            root.style.display = 'block';

            addMessage('bot', cfg.welcome_message || 'Здравствуйте! Чем могу помочь?');

            // по умолчанию панель закрыта, только кнопка видна
            setBtnIcon(false);
            } catch (e) {
            loading.textContent = 'Не удалось загрузить виджет.';
            console.error('SA widget init error:', e);
            }
        }

        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'SA_CONFIG' && e.data.baseUrl) {
            baseUrl = e.data.baseUrl;
            init();
            }
        });

        if (baseUrl) init();
        })();
        </script>
    </body>
</html>
