<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; background: transparent; }
    #sa-loading { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 13px; color: #999; }
    #sa-root { position: relative; width: 100%; height: 100%; display: none; }
  </style>
  <script>
    (function () {
      var baseUrl = new URLSearchParams(location.search).get('baseUrl') || '';
      var sessionId = 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      var operatorMode = false;
      var operatorActive = false;
      var lastOperatorMsgId = 0;
      var pollTimer = null;
      var botName = 'Помощник';
      var initiated = false;
      var isOpen = false;

      var BOT_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>';
      var CHAT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
      var CLOSE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
      var HEADPHONES_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"></path><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>';

      function setBtnIcon(btn, open) {
        btn.innerHTML = open ? CLOSE_SVG : CHAT_SVG;
      }

      function addMessage(messagesEl, role, text) {
        var el = document.createElement('div');
        el.className = 'sa-msg ' + role;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function applyTheme(cfg) {
        var style = document.getElementById('sa-dynamic-theme');
        style.textContent = '\n#sa-widget-btn { background:' + (cfg.accent_color || '#01696f') + '; }\n#sa-widget-header { background:' + (cfg.accent_color || '#01696f') + '; }\n#sa-widget-messages { background:' + (cfg.chat_bg_color || '#f8f9fb') + '; }\n.sa-msg.user { background:' + (cfg.user_bubble_bg || '#01696f') + '; color:' + (cfg.user_text_color || '#ffffff') + '; }\n.sa-msg.bot { background:' + (cfg.bot_bubble_bg || '#ffffff') + '; color:' + (cfg.bot_text_color || '#222222') + '; }\n#sa-operator-btn:hover { border-color:' + (cfg.accent_color || '#01696f') + '; color:' + (cfg.accent_color || '#01696f') + '; }\n#sa-widget-input:focus { border-color:' + (cfg.accent_color || '#01696f') + '; }\n#sa-widget-send { background:' + (cfg.accent_color || '#01696f') + '; }\n';
      }

      function startOperatorPoll(ctx) {
        if (pollTimer) return;
        pollTimer = setInterval(async function () {
          try {
            var r = await fetch(baseUrl + '/api/operator/poll/' + sessionId + '?last_id=' + lastOperatorMsgId);
            var data = await r.json();

            if (data.status === 'active' && !operatorActive) {
              operatorActive = true;
              ctx.opBarText.textContent = 'Оператор подключён';
              ctx.avatar.innerHTML = HEADPHONES_SVG;
              ctx.avatar.style.color = '#fff';
              ctx.headerName.textContent = 'Оператор';
              ctx.headerStatus.textContent = 'Онлайн';
              ctx.operatorOverlay.classList.remove('visible');
            }

            if (data.messages && data.messages.length) {
              data.messages.forEach(function (m) {
                addMessage(ctx.messagesEl, 'operator', m.content);
                lastOperatorMsgId = m.id;
              });
            }

            if (data.status === 'closed') {
              clearInterval(pollTimer);
              pollTimer = null;
              addMessage(ctx.messagesEl, 'system', 'Оператор завершил сеанс. Чат снова с AI-помощником.');
              operatorMode = false;
              operatorActive = false;
              ctx.operatorBar.classList.remove('visible');
              ctx.operatorOverlay.classList.add('visible');
              ctx.operatorBtn.disabled = false;
              ctx.operatorBtn.innerHTML = HEADPHONES_SVG + ' Связаться с оператором';
              ctx.avatar.innerHTML = BOT_SVG;
              ctx.avatar.style.color = '#fff';
              ctx.headerName.textContent = botName;
              ctx.headerStatus.textContent = 'Онлайн';
            }
          } catch (e) {}
        }, 3000);
      }

      async function init() {
        if (initiated || !baseUrl) return;
        initiated = true;

        var loading = document.getElementById('sa-loading');
        var root = document.getElementById('sa-root');

        try {
          var cssHref = baseUrl + '/widget-static/saportus-widget.css';
          document.getElementById('sa-shared-css').setAttribute('href', cssHref);

          var r = await fetch(baseUrl + '/api/widget-config');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          var cfg = await r.json();
          botName = cfg.bot_name || 'Помощник';

          root.innerHTML = '\n<button id="sa-widget-btn" aria-label="Открыть чат помощника">' + CHAT_SVG + '</button>\n<div id="sa-widget-panel" role="dialog">\n  <div id="sa-widget-header">\n    <div class="sa-avatar" id="sa-avatar">' + BOT_SVG + '</div>\n    <div>\n      <div class="sa-name" id="sa-header-name">' + botName + '</div>\n      <div class="sa-status" id="sa-header-status">Онлайн</div>\n    </div>\n    <button class="sa-close" aria-label="Закрыть">×</button>\n  </div>\n  <div id="sa-widget-operator-bar">\n    <div class="sa-op-dot"></div>\n    <span id="sa-op-bar-text">Ожидание оператора...</span>\n  </div>\n  <div id="sa-widget-body">\n    <div id="sa-widget-messages"></div>\n    <div id="sa-widget-operator-overlay" class="visible">\n      <button id="sa-operator-btn">' + HEADPHONES_SVG + ' Связаться с оператором</button>\n    </div>\n  </div>\n  <div id="sa-widget-input-area">\n    <textarea id="sa-widget-input" placeholder="Напишите сообщение..." rows="1"></textarea>\n    <button id="sa-widget-send">Отправить</button>\n  </div>\n</div>';

          applyTheme(cfg);

          var ctx = {
            panel: document.getElementById('sa-widget-panel'),
            btn: document.getElementById('sa-widget-btn'),
            messagesEl: document.getElementById('sa-widget-messages'),
            input: document.getElementById('sa-widget-input'),
            sendBtn: document.getElementById('sa-widget-send'),
            operatorBtn: document.getElementById('sa-operator-btn'),
            operatorOverlay: document.getElementById('sa-widget-operator-overlay'),
            operatorBar: document.getElementById('sa-widget-operator-bar'),
            opBarText: document.getElementById('sa-op-bar-text'),
            headerName: document.getElementById('sa-header-name'),
            headerStatus: document.getElementById('sa-header-status'),
            avatar: document.getElementById('sa-avatar'),
            closeBtn: document.querySelector('.sa-close')
          };

          function sendAiMessage() {
            var text = ctx.input.value.trim();
            if (!text) return;
            ctx.input.value = '';
            ctx.input.style.height = '38px';
            ctx.sendBtn.disabled = true;
            addMessage(ctx.messagesEl, 'user', text);
            var typingEl = addMessage(ctx.messagesEl, 'bot typing', '...');
            fetch(baseUrl + '/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: text, session_id: sessionId })
            })
              .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
              .then(function (res) {
                typingEl.remove();
                addMessage(ctx.messagesEl, 'bot', res.ok ? (res.data.reply || 'Извините, не могу ответить прямо сейчас.') : 'Извините, не могу ответить прямо сейчас. Попробуйте позже.');
              })
              .catch(function () {
                typingEl.remove();
                addMessage(ctx.messagesEl, 'bot', 'Ошибка соединения с сервером.');
              })
              .finally(function () {
                ctx.sendBtn.disabled = false;
                ctx.input.focus();
              });
          }

          function sendOperatorMessage() {
            var text = ctx.input.value.trim();
            if (!text) return;
            ctx.input.value = '';
            ctx.input.style.height = '38px';
            ctx.sendBtn.disabled = true;
            addMessage(ctx.messagesEl, 'user', text);
            fetch(baseUrl + '/api/operator/user-message', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ session_id: sessionId, message: text })
            })
              .catch(function () {})
              .finally(function () {
                ctx.sendBtn.disabled = false;
                ctx.input.focus();
              });
          }

          ctx.operatorBtn.addEventListener('click', function () {
            if (operatorMode) return;
            operatorMode = true;
            ctx.operatorBtn.disabled = true;
            ctx.operatorBtn.innerHTML = '⏳ Запрос отправлен...';
            ctx.operatorBar.classList.add('visible');
            ctx.opBarText.textContent = 'Ожидание оператора...';
            addMessage(ctx.messagesEl, 'system', 'Запрос на подключение оператора отправлен. Ожидайте ответа.');
            fetch(baseUrl + '/api/operator/request', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'Пользователь запрашивает оператора', session_id: sessionId })
            }).catch(function () {});
            startOperatorPoll(ctx);
          });

          ctx.sendBtn.addEventListener('click', function () {
            if (operatorMode) sendOperatorMessage(); else sendAiMessage();
          });

          ctx.input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              if (operatorMode) sendOperatorMessage(); else sendAiMessage();
            }
          });

          ctx.input.addEventListener('input', function () {
            this.style.height = '38px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
          });

          ctx.btn.addEventListener('click', function () {
            isOpen = !isOpen;
            if (isOpen) {
              ctx.panel.classList.add('open');
              setBtnIcon(ctx.btn, true);
              ctx.input.focus();
            } else {
              ctx.panel.classList.remove('open');
              setBtnIcon(ctx.btn, false);
            }
          });

          ctx.closeBtn.addEventListener('click', function () {
            isOpen = false;
            ctx.panel.classList.remove('open');
            setBtnIcon(ctx.btn, false);
          });

          loading.style.display = 'none';
          root.style.display = 'block';
          addMessage(ctx.messagesEl, 'bot', cfg.welcome_message || 'Здравствуйте! Чем могу помочь?');
          setBtnIcon(ctx.btn, false);
        } catch (e) {
          loading.textContent = 'Не удалось загрузить виджет.';
          console.error('SA widget init error:', e);
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'SA_CONFIG' && e.data.baseUrl) {
          baseUrl = e.data.baseUrl;
          init();
        }
      });

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
  <link id="sa-shared-css" rel="stylesheet" href="" />
  <style id="sa-dynamic-theme"></style>
</head>
<body>
  <div id="sa-loading">Загрузка...</div>
  <div id="sa-root"></div>
</body>
</html>
